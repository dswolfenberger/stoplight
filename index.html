<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
      <script src="index.js" defer></script>
    <title>Stoplight</title>
</head>
<body>
  <h1>Don't cause a jam</h1>
  
<section id="backdrop">
    <img id="car1" src="images/car_1.png">
    <img id="car2" src="images/car_2.png">
    <img id="car3" src="images/car_3.png">
    <img id="car4" src="images/car_4.png">
    
    <div id="roadhorz"></div>
     <div id="roadvert"></div>

    <div id="intersection-lights">
      <div class="stoplight" id="stoplight1">
        <div class="stop"></div>
        <div class="slow"></div>
        <div class="go"></div>
      </div>
      <div class="stoplight" id="stoplight2">
          <div class="stop"></div>
          <div class="slow"></div>
          <div class="go"></div>
      </div>
      <div class="stoplight" id="stoplight3">
          <div class="stop"></div>
          <div class="slow"></div>
          <div class="go"></div>
      </div>
      <div class="stoplight" id="stoplight4">
          <div class="stop"></div>
          <div class="slow"></div>
          <div class="go"></div>
      </div>
    </div>
</section>
  

</body>
</html>
